[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "portfolio-manager"
version = "0.1.0"
description = "Portfolio foundation for a proactive investment assistant"
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi==0.142.2", "uvicorn==0.54.0", "SQLAlchemy==2.0.54",
  "pydantic==2.13.5", "pydantic-settings==2.15.0", "alembic==1.20.0",
  "psycopg[binary]==3.3.6", "redis==6.4.0", "celery==5.6.3",
  "Jinja2==3.1.6", "argon2-cffi==25.1.0", "python-multipart==0.0.32",
]

[project.optional-dependencies]
dev = ["pytest==8.4.2", "httpx==0.28.1", "ruff==0.16.10", "mypy==1.20.2", "fakeredis==2.39.0"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["templates/*.html"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
files = ["app", "scripts"]
disallow_untyped_defs = true
check_untyped_defs = true
warn_unused_ignores = true

[[tool.mypy.overrides]]
module = ["celery", "celery.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["integration: requires a dedicated PostgreSQL test database", "queue: requires real Redis and a Celery worker"]
