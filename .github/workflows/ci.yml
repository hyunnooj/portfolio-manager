name: Foundation CI
on: [push, pull_request]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17.11
        env:
          POSTGRES_USER: portfolio
          POSTGRES_PASSWORD: ci-only-password
          POSTGRES_DB: portfolio_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U portfolio -d portfolio_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
      redis:
        image: redis:7.4.11-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://portfolio:ci-only-password@127.0.0.1:5432/portfolio_test
      TEST_DATABASE_URL: postgresql+psycopg://portfolio:ci-only-password@127.0.0.1:5432/portfolio_test
      REDIS_URL: redis://127.0.0.1:6379/0
      TEST_REDIS_URL: redis://127.0.0.1:6379/15
      RAG_ENABLED: "false"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -c requirements.lock -e '.[dev]'
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy
      - run: pytest -q
      - name: Empty database migration and drift check
        run: |
          alembic upgrade head
          alembic check
